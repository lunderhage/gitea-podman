# A disposable experiment, separate from the production Gitea Compose file.
services:
  controller:
    image: ${LIFECYCLE_MANAGER_IMAGE:-localhost/gitea-podman-manager:4}
    container_name: gitea-lifecycle-test-controller
    restart: "no"
    labels:
      org.gitea-podman.lifecycle-test: gitea-lifecycle-test
    security_opt:
      - label=disable
    volumes:
      - "${LIFECYCLE_SOCKET:?Set the rootless Podman socket}:/run/podman/podman.sock"
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
      HOME: /tmp/lifecycle-home
      XDG_RUNTIME_DIR: /tmp/lifecycle-runtime
    entrypoint: [python3, -c]
    command:
      - |
        import os
        import time
        for name in ("HOME", "XDG_RUNTIME_DIR"):
            os.makedirs(os.environ[name], mode=0o700, exist_ok=True)
        print("Controller ready", flush=True)
        while True:
            time.sleep(3600)
    networks:
      - experiment

  target:
    image: docker.io/library/alpine:3.22
    container_name: gitea-lifecycle-test-target
    restart: always
    labels:
      org.gitea-podman.lifecycle-test: gitea-lifecycle-test
    stop_grace_period: 30s
    depends_on:
      - controller
    entrypoint: [/bin/sh, -c]
    command:
      - |
        trap 'echo "Target stopped cleanly"; exit 0' TERM INT
        echo "Target ready"
        while :; do
          sleep 1 &
          wait $$!
        done
    networks:
      - experiment

networks:
  experiment:
    name: gitea-lifecycle-test-network
    labels:
      org.gitea-podman.lifecycle-test: gitea-lifecycle-test
